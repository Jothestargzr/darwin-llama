name: Build LLaMA submodule

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build-llama:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgomp1

      - name: Build llama.cpp if present
        run: |
          set -e
          if [ -d "third_party/llama.cpp" ]; then
            cd third_party/llama.cpp
            # prefer CMake-based build (newer llama.cpp uses CMake)
            if [ -f CMakeLists.txt ]; then
              mkdir -p build && cd build
              cmake .. -DCMAKE_BUILD_TYPE=Release
              make -j"$(nproc)"
            elif [ -f Makefile ]; then
              make -j"$(nproc)"
            else
              echo "No recognized build system in third_party/llama.cpp" && exit 1
            fi
          else
            echo "third_party/llama.cpp not found" && exit 1
          fi
